  window.onerror = function(msg, src, line) {
    var el = document.getElementById('boot-error');
    if (el) {
      el.style.display = 'block';
      el.innerText = 'Load error: ' + msg + ' (' + (src || '') + ':' + line + ')';
    }
  };

<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbxfGJti6JuILSU_NeaFb5ATQPU5L00tY8uenZQFFT7xtukQqA0fZhBnu2mZI5crjE16/exec", KEY = 'exp_key';
  function getKey() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function askKey() {
    var k = prompt('Enter your access key');
    if (k && k.trim()) { try { localStorage.setItem(KEY, k.trim()); } catch (e) {} location.reload(); }
  }
  var READ_ONLY = ['getBootstrap', 'getVersion', 'widgetSummary'];   // lệnh ghi không gọi lại (tránh lưu trùng)
  function call(fn, args, tries) {
    // GET ?q=: iOS Safari làm rơi thân POST khi đi qua redirect của Apps Script.
    // Google thỉnh thoảng trả trang lỗi HTML (404 ở bước echo) → tự gọi lại tối đa 2 lần.
    tries = tries || 0;
    var q = encodeURIComponent(JSON.stringify({ fn: fn, args: args, key: getKey() }));
    return fetch(API + '?q=' + q + '&_=' + Date.now(), { redirect: 'follow', cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) { return JSON.parse(t); })
      .catch(function (e) {
        if (tries < 2 && READ_ONLY.indexOf(fn) >= 0) return new Promise(function (ok) { setTimeout(ok, 800 * (tries + 1)); }).then(function () { return call(fn, args, tries + 1); });
        throw e;
      });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (_, p) {
      if (p === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (p === 'withFailureHandler') return function (f) { return runner(ok, f); };
      return function () {
        call(p, [].slice.call(arguments)).then(function (res) {
          if (res && res.error === 'Unauthorized') { askKey(); if (fail) fail('Access key required'); return; }
          if (!res || res.service === 'expense-api') { if (fail) fail('Unexpected API response'); return; }
          if (ok) ok(res);
        }).catch(function (e) { if (fail) fail('Network error: ' + (e && e.message || e)); });
      };
    } });
  }
  window.google = { script: { run: runner(), url: { getLocation: function (cb) {
    var q = {}; new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; }); cb({ parameter: q, hash: location.hash });
  } } } };
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
})();
</script>

<style>

:root {
  --bg: #0E0E0F;
  --card: #1C1C1E;
  --card2: #2A2A2D;
  --line: #2E2E31;
  --text: #F2F2F2;
  --muted: #8E8E93;
  --green: #2DB84C;
  --green-bg: rgba(45, 184, 76, .14);
  --red: #FF5A52;
  --red-bg: rgba(255, 90, 82, .16);
  --amber: #F5B83D;
  --amber-bg: rgba(245, 184, 61, .15);
  --blue: #3B8BFF;
  --radius: 18px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: 'Be Vietnam Pro', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.35; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: var(--text); }
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(var(--nav-h) + var(--safe-b) + 28px); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); } .amber { color: var(--amber); }
.small { font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* header */
.hdr { padding: 18px 0 10px; }
.hdr h1 { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -.5px; }
.hdr .sub { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: middle; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--card); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
.unit { font-size: 12px; color: var(--muted); font-style: italic; }

/* month switcher */
.seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin: 10px 0 14px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .3px; }
.seg button.on { background: var(--card2); color: var(--green); }
.mswitch { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 14px; }
.mswitch .lbl { font-weight: 600; font-size: 16px; }
.mswitch button { width: 40px; height: 36px; border-radius: 10px; background: var(--card); font-size: 18px; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.card.tight { padding: 0; overflow: hidden; }
.sec-title { font-size: 13px; font-weight: 700; letter-spacing: .8px; color: var(--muted); text-transform: uppercase; margin: 18px 2px 10px; display: flex; justify-content: space-between; align-items: center; }
.sec-title .link { text-transform: none; letter-spacing: 0; color: var(--green); font-weight: 600; font-size: 14px; }
.big { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
.mid { font-size: 20px; font-weight: 600; }
.kgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.kbox { background: var(--card2); border-radius: 12px; padding: 11px 12px; }
.kbox .k { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; }
.kbox .v { font-size: 19px; font-weight: 600; margin-top: 3px; }
.foot-note { font-size: 11.5px; color: var(--muted); margin-top: 12px; text-align: center; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.g { background: var(--green-bg); color: var(--green); }
.pill.r { background: var(--red-bg); color: var(--red); }
.pill.a { background: var(--amber-bg); color: var(--amber); }
.pill.n { background: var(--card2); color: var(--muted); }

/* progress */
.bar { position: relative; height: 8px; border-radius: 6px; background: var(--card2); margin: 12px 0 8px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.bar .fc { position: absolute; top: 0; bottom: 0; border-radius: 6px; opacity: .18; }
.bar .tick { position: absolute; top: -4px; width: 2px; height: 16px; background: #fff; border-radius: 1px; }
.bar-legend { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.bar-legend b { color: var(--text); font-weight: 600; }

/* lists */
.item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item.tap:active { background: var(--card2); }
.ic { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; }
.ic.sm { width: 32px; height: 32px; font-size: 16px; }
.t1 { font-weight: 600; }
.t2 { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.amt { font-weight: 600; white-space: nowrap; }
.dayhead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dayhead .dd { font-size: 30px; font-weight: 700; width: 42px; }
.bud { padding: 14px 16px; border-top: 1px solid var(--line); }
.bud:first-child { border-top: 0; }
.bud:active { background: var(--card2); }
.chev { color: var(--muted); font-size: 20px; margin-left: 2px; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: #151517; border-top: 1px solid var(--line); padding-bottom: var(--safe-b); z-index: 20; }
.nav-in { max-width: 520px; margin: 0 auto; display: flex; height: var(--nav-h); align-items: center; }
.nav-in button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.nav-in button .i { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .75; }
.nav-in button.on { color: var(--green); }
.nav-in button.on .i { filter: none; opacity: 1; }
.fab { width: 58px !important; height: 58px; flex: none !important; border-radius: 50%; background: var(--green) !important; color: #fff !important; font-size: 32px !important; margin-top: -26px; box-shadow: 0 6px 20px rgba(45, 184, 76, .4); justify-content: center; }

/* sheet (modal) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 94vh; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 14px 16px calc(18px + var(--safe-b)); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-top .ttl { font-weight: 700; font-size: 17px; }
.txt-btn { color: var(--green); font-weight: 600; padding: 6px 4px; }
.txt-btn.red { color: var(--red); }
.page-full { position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow-y: auto; }
.page-full .app { padding-bottom: 40px; }

/* add form */
.typeseg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.typeseg button { flex: 1; padding: 8px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.typeseg button.on.e { background: var(--red-bg); color: var(--red); }
.typeseg button.on.i { background: rgba(59, 139, 255, .16); color: var(--blue); }
.quick { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.quick input { flex: 1; background: none; border: 0; outline: none; font-size: 16px; }
.amount-disp { text-align: right; font-size: 40px; font-weight: 700; padding: 6px 4px 2px; letter-spacing: -.5px; }
.amount-disp .u { font-size: 12px; color: var(--muted); font-weight: 400; display: block; letter-spacing: 0; }
.field { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
.field input, .field select { flex: 1; background: none; border: 0; outline: none; font-size: 15px; min-width: 0; }
.field select option { background: var(--card); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; white-space: nowrap; }
.chip.on { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.keypad button { height: 50px; border-radius: 12px; background: var(--card); font-size: 20px; font-weight: 500; }
.keypad button.op { background: var(--card2); font-size: 16px; }
.keypad button.ok { background: var(--green); color: #fff; font-weight: 700; font-size: 16px; grid-row: span 2; height: auto; }
.catgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.catgrid button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; font-size: 11.5px; text-align: center; }
.catgrid button.on { background: var(--green-bg); color: var(--green); }
.catgrid .ic { width: 42px; height: 42px; }
.parent-lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin: 12px 4px 4px; text-transform: uppercase; letter-spacing: .6px; }
.btn { display: block; width: 100%; padding: 14px; border-radius: 14px; background: var(--green); color: #fff; font-weight: 700; font-size: 16px; text-align: center; }
.btn.ghost { background: var(--card); color: var(--text); }
.btn.danger { background: var(--red-bg); color: var(--red); }
.btn:disabled { opacity: .5; }
.btns { display: flex; gap: 8px; margin-top: 12px; }

/* misc */
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 9px 12px; margin-bottom: 12px; }
.search input { flex: 1; background: none; border: 0; outline: none; }
.err { background: var(--red-bg); color: #FFB4AE; border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 13.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + var(--safe-b) + 18px); background: #2C2C2E; color: var(--text); padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); max-width: 90vw; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; }
.hbar { height: 6px; border-radius: 4px; background: var(--card2); margin-top: 6px; overflow: hidden; }
.hbar > div { height: 100%; border-radius: 4px; background: var(--green); }
.chart-box { position: relative; height: 210px; }
.ring { width: 72px; height: 72px; flex: none; }
.pending { border: 1px dashed #4A4A4E; }
.inp { width: 92px; text-align: right; background: var(--card2); border: 0; border-radius: 9px; padding: 7px 9px; outline: none; }
.inp.wide { width: 100%; text-align: left; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--card2); border-top-color: var(--green); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Add transaction — kiểu Money Lover */
.mlform { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 14px; margin-bottom: 12px; }
.mlrow { display: flex; align-items: center; gap: 14px; min-height: 58px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mlrow:last-child { border-bottom: 0; }
.mlrow input { background: none; border: 0; outline: none; font-size: 16px; min-width: 0; color: var(--text); }
.mlrow.amt { min-height: 74px; }
.mlrow.amt.focus .mlamt { border-bottom-color: var(--green); }
.curbox { flex: none; width: 40px; height: 28px; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.mlamt { flex: 1; font-size: 32px; font-weight: 700; border-bottom: 2px solid var(--line); padding: 4px 0; letter-spacing: -.5px; }
.ml-big { font-size: 18px; font-weight: 600; }
.ml-ic { width: 40px; text-align: center; font-size: 18px; color: var(--muted); flex: none; }
.ml-date { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.kpwrap { position: sticky; bottom: calc(-18px - var(--safe-b)); background: var(--bg); padding: 8px 0 4px; margin-top: 8px; }
.btn.danger { background: var(--red-bg); color: var(--red); }
.cs-full { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; padding: 14px 16px calc(24px + var(--safe-b)); max-width: 520px; margin: 0 auto; }
.cs-group { border-bottom: 1px solid var(--line); }
.cs-group:last-child { border-bottom: 0; }
.cs-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; font-size: 15.5px; position: relative; }
.cs-row.on { color: var(--green); }
.cs-row.child { padding-left: 40px; }
.cs-row.child .ic { width: 34px; height: 34px; font-size: 16px; }
.cs-tree { position: absolute; left: 33px; top: 0; bottom: 0; width: 12px; border-left: 1.5px solid var(--card2); }
.cs-tree::after { content: ''; position: absolute; left: 0; top: 50%; width: 10px; border-top: 1.5px solid var(--card2); }
.cs-row.child.last .cs-tree { bottom: 50%; }

/* v2 — ví · báo cáo · nhập nhanh */
.eye { font-size: 18px; opacity: .8; padding: 4px; }
.card-head { padding: 12px 16px 4px; }
.link { color: var(--green); font-weight: 600; font-size: 14px; }
.wsel { position: relative; display: inline-flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; color: var(--text); font-weight: 600; }
.wsel select { position: absolute; inset: 0; opacity: 0; width: 100%; }
.wbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
.wbtns button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); padding: 6px 0; border-radius: 12px; }
.wbtns button span { width: 44px; height: 44px; border-radius: 50%; background: var(--green-bg); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 19px; }
.wbtns button:active { background: var(--card2); }
.typeseg.three button { font-size: 14px; }
.typeseg button.on.t { background: var(--green-bg); color: var(--green); }
.catchips { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); grid-auto-columns: 74px; gap: 4px; overflow-x: auto; padding: 8px 0 10px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.catchips::-webkit-scrollbar { display: none; }
.catchips button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 12px; font-size: 11px; min-width: 0; color: var(--muted); }
.catchips button .ci { width: 38px; height: 38px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.catchips button span.ellipsis { max-width: 100%; }
.catchips button.on { color: var(--green); }
.catchips button.on .ci { background: var(--green-bg); box-shadow: inset 0 0 0 2px var(--green); }
.mlrow .chip { padding: 5px 10px; font-size: 12.5px; }
.keypad button:disabled { opacity: .5; }
.ie-row { display: flex; justify-content: space-between; font-size: 14px; }
.donut { position: relative; height: 200px; }
.donut-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.donut-c .t1 { font-size: 20px; }
.mtable { display: grid; grid-template-columns: 1fr 1.3fr 1.3fr .9fr; gap: 6px; padding: 11px 16px; border-top: 1px solid var(--line); font-size: 14px; text-align: right; }
.mtable span:first-child { text-align: left; font-weight: 600; }
.mtable.head { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.mtable.tap:active { background: var(--card2); }

/* Edit budgets v2 */
.bsum { padding: 14px 16px; }
.bcard { margin-bottom: 12px; }
.bhead { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card2); }
.brow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
.brow.hl { background: var(--green-bg); }
.binp { width: 116px; flex: none; text-align: right; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; outline: none; font-size: 16px; font-weight: 600; }
.binp:focus { border-color: var(--green); }
.binp::placeholder { color: #55555A; font-weight: 400; }
.mini-seg { display: flex; background: var(--bg); border-radius: 9px; padding: 2px; flex: none; }
.mini-seg button { padding: 5px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.mini-seg button.on { background: var(--green-bg); color: var(--green); }

/* bàn phím có + − × ÷ */

<body>
<div id="boot-error" style="display:none;font-family:Arial;padding:16px;color:#FCA5A5;background:#3B1111;border:1px solid #7F1D1D;margin:16px;border-radius:12px;"></div>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8E8E93;font-family:sans-serif;font-size:14px;gap:10px;background:#0E0E0F;">
    <div style="width:18px;height:18px;border:3px solid #2A2A2D;border-top-color:#2DB84C;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    Loading…
  </div>
</div>
<script>
// ===================================================================
// CORE — format, RPC, model (mọi phép tính nằm ở đây; page chỉ hiển thị)
// Đơn vị: NGHÌN ĐỒNG. Không nhân 1.000, không gắn ₫.
// ===================================================================
const {
  useState,
  useEffect,
  useMemo,
  useRef,
  useCallback
} = React;
const UNIT_LABEL = 'Unit: thousand VND';
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON3 = MONTHS.map(m => m.slice(0, 3));
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// ---- format ----
const NF = new Intl.NumberFormat('en-US', {
  maximumFractionDigits: 0
});
const fmt = v => v == null || isNaN(v) ? '—' : NF.format(Math.round(v * 100) / 100);
const fmtS = v => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + NF.format(Math.abs(Math.round(v * 100) / 100));
const fmtPct = v => v == null || !isFinite(v) ? '—' : Math.round(v * 100) + '%';
const pad2 = n => ('0' + n).slice(-2);
const ymOf = d => d.slice(0, 7); // 'yyyy-MM'
const ymLabel = ym => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const ymShort = ym => MON3[+ym.slice(5, 7) - 1] + ' ' + ym.slice(2, 4);
const ymAdd = (ym, k) => {
  const y = +ym.slice(0, 4),
    m = +ym.slice(5, 7) - 1 + k;
  const d = new Date(y, m, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
};
const daysIn = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
const budgetMonthKey = ym => ym.slice(5, 7) + '/' + ym.slice(0, 4); // sheet Budgets dùng MM/YYYY
const dowOf = d => new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)).getDay();
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
const parseNum = s => {
  const t = String(s || '').trim().replace(/,/g, '');
  if (!t) return null;
  const n = Number(t);
  return isNaN(n) ? null : n;
};

// ---- máy tính trên bàn phím nhập tiền (như Money Lover) ----
const CALC_OPS = '+−×÷';
const hasOp = s => /[+−×÷]/.test(String(s || ''));
/** Tính "35+20×2" (× ÷ trước, + − sau). Toán tử ở cuối bị bỏ qua. Sai/chia cho 0 → null. Không dùng eval. */
function calcEval(expr) {
  const s = String(expr || '').replace(/[+−×÷]+$/, '');
  if (!s) return null;
  const parts = s.split(/([+−×÷])/);
  const terms = [parseFloat(parts[0])];
  for (let i = 1; i < parts.length; i += 2) {
    const op = parts[i],
      n = parseFloat(parts[i + 1]);
    if (isNaN(n)) return null;
    const last = terms.length - 1;
    if (op === '×') terms[last] *= n;else if (op === '÷') {
      if (!n) return null;
      terms[last] /= n;
    } else terms.push(op === '−' ? -n : n);
  }
  if (terms.some(isNaN)) return null;
  return Math.round(terms.reduce((a, b) => a + b, 0) * 100) / 100;
}
const fmtExpr = s => String(s || '').replace(/[\d.]+/g, n => fmtTyping(n)).replace(/([+−×÷])/g, ' $1 ');

// ---- RPC ----
const IS_SNAPSHOT = !!window.__SNAPSHOT__;
function rpc(fn, payload) {
  return new Promise((resolve, reject) => {
    if (IS_SNAPSHOT) {
      resolve(fn === 'getBootstrap' ? window.__SNAPSHOT__ : {
        __ok: true
      });
      return;
    }
    if (!window.google || !google.script || !google.script.run) {
      reject('Open this page from the deployed web app link.');
      return;
    }
    google.script.run.withSuccessHandler(res => res && res.__ok ? resolve(res) : reject(res && res.error || 'Unknown error')).withFailureHandler(err => reject(String(err && err.message || err)))[fn](payload);
  });
}
const BOOT_CACHE = 'exp_boot';
function readBootCache() {
  try {
    const b = JSON.parse(localStorage.getItem(BOOT_CACHE) || 'null');
    if (!b || !b.tx) return null;
    const d = new Date(),
      today = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    return {
      ...b,
      today
    }; // dữ liệu cũ nhưng ngày phải là hôm nay
  } catch (e) {
    return null;
  }
}
function readUrlParams() {
  return new Promise(resolve => {
    try {
      google.script.url.getLocation(loc => resolve(loc.parameter || {}));
    } catch (e) {
      resolve({});
    }
  });
}

// ---- model ----
function buildModel(boot) {
  const cols = boot.tx.cols;
  const tx = boot.tx.rows.map(r => {
    const o = {};
    cols.forEach((c, i) => {
      o[c] = r[i];
    });
    o.amount = Number(o.amount) || 0;
    return o;
  });
  const cats = boot.categories.filter(c => c.name);
  const catBy = {};
  cats.forEach(c => {
    catBy[c.name] = c;
  });
  const parentOf = name => {
    const c = catBy[name];
    return c && c.parent && catBy[c.parent] ? c.parent : name;
  };
  const childrenOf = {};
  cats.forEach(c => {
    const p = parentOf(c.name);
    (childrenOf[p] = childrenOf[p] || []).push(c.name);
  });
  const excluded = name => !!(catBy[name] && catBy[name].exclude);
  const isFixed = name => !!(catBy[parentOf(name)] && catBy[parentOf(name)].fixed);
  const disp = name => catBy[name] && catBy[name].display || name;
  const icon = name => catBy[name] && catBy[name].icon || '•';
  tx.forEach(t => {
    t.wallet = t.wallet || DEFAULT_WALLET;
  });
  const posted = tx.filter(t => t.status !== 'pending');
  const pending = tx.filter(t => t.status === 'pending');
  // Ví: ví có giao dịch nhưng chưa khai báo trong sheet Wallets vẫn hiện (số dư đầu = 0).
  const wl = (boot.wallets && boot.wallets.length ? boot.wallets : [{
    name: DEFAULT_WALLET,
    opening_balance: 0
  }]).map((w, i) => ({
    icon: '👛',
    kind: 'basic',
    exclude_total: false,
    active: true,
    sort: i + 1,
    ...w,
    opening_balance: Number(w.opening_balance) || 0
  }));
  const seen = new Set(wl.map(w => w.name));
  tx.forEach(t => {
    if (!seen.has(t.wallet)) {
      seen.add(t.wallet);
      wl.push({
        name: t.wallet,
        opening_balance: 0,
        icon: '👛',
        kind: 'basic',
        exclude_total: false,
        active: true,
        sort: 99
      });
    }
  });
  const wallets = wl.sort((a, b) => a.sort - b.sort);
  const walletBy = {};
  wallets.forEach(w => {
    walletBy[w.name] = w;
  });
  const inTotal = new Set(wallets.filter(w => !w.exclude_total).map(w => w.name));
  const opening = sumBy(wallets.filter(w => inTotal.has(w.name)), w => w.opening_balance);
  return {
    boot,
    tx,
    posted,
    pending,
    cats,
    catBy,
    parentOf,
    childrenOf,
    excluded,
    isFixed,
    disp,
    icon,
    opening,
    wallets,
    walletBy,
    inTotal,
    today: boot.today,
    settings: boot.settings || {}
  };
}
const DEFAULT_WALLET = 'Cash';
const CAT_ADJUST = 'Điều chỉnh số dư';
const CAT_TRANSFER_OUT = 'Tiền chuyển đi';
const CAT_TRANSFER_IN = 'Tiền chuyển đến';
const signed = t => t.type === 'income' ? t.amount : -t.amount;
const sumBy = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const isTransfer = t => !!t.link_id;
const ALL_WALLETS = '*';
/** Ví có thuộc bộ lọc không: tên ví · ALL_WALLETS = mọi ví · '' = các ví tính vào tổng. */
const inWallet = (M, wallet, name) => wallet === ALL_WALLETS ? true : wallet ? name === wallet : M.inTotal.has(name);
/** Số dư trước ngày dateExclusive (không gồm ngày đó). wallet: xem inWallet. */
function balanceAt(M, dateExclusive, wallet) {
  const ok = t => inWallet(M, wallet, t.wallet) && (!dateExclusive || t.date < dateExclusive);
  const open = sumBy(M.wallets.filter(w => inWallet(M, wallet, w.name)), w => w.opening_balance);
  return open + sumBy(M.posted.filter(ok), signed);
}
function walletBalances(M) {
  return M.wallets.map(w => ({
    ...w,
    balance: balanceAt(M, null, w.name)
  }));
}
/** Cặp chuyển tiền của 1 giao dịch: {out, in}. */
function transferPair(M, t) {
  const both = M.posted.filter(x => x.link_id && x.link_id === t.link_id);
  return {
    out: both.find(x => x.type === 'expense'),
    in: both.find(x => x.type === 'income')
  };
}
function monthTx(M, ym) {
  return M.posted.filter(t => t.date.startsWith(ym));
}
function reportable(M, list) {
  return list.filter(t => !M.excluded(t.category));
}

/** Budget của 1 nhóm lá cho tháng ym: dòng MM/YYYY thắng dòng default. */
function leafBudget(M, ym) {
  const key = budgetMonthKey(ym),
    out = {};
  M.boot.budgets.forEach(b => {
    if (b.month === 'default') out[b.category] = b.amount;
  });
  M.boot.budgets.forEach(b => {
    if (b.month === key) out[b.category] = b.amount;
  });
  return out;
}

/** Tiến độ tháng: số ngày đã qua d / tổng D. Tháng quá khứ d=D, tương lai d=0. */
function monthProgress(M, ym) {
  const D = daysIn(ym),
    tym = ymOf(M.today);
  const d = ym < tym ? D : ym > tym ? 0 : +M.today.slice(8, 10);
  return {
    d,
    D,
    left: D - d,
    isCurrent: ym === tym
  };
}

/**
 * Dự báo chi cuối tháng cho 1 khoản.
 * Đầu tháng ít dữ liệu nên trộn nhịp thực tế với nhịp ngân sách: w = min(1, d/10).
 * Nhóm hoá đơn cố định: max(đã chi + nháp định kỳ còn chờ, target).
 */
function forecastOf(spent, target, prog, fixed, pendingAmt) {
  const {
    d,
    D
  } = prog;
  if (d >= D) return spent;
  if (fixed) return Math.max(spent + (pendingAmt || 0), target || 0);
  if (d === 0) return Math.max(spent, target || 0);
  const w = Math.min(1, d / 10);
  const pace = w * (spent / d) + (1 - w) * ((target || 0) / D);
  return spent + pace * (D - d);
}

/** Bảng ngân sách theo nhóm cha cho tháng ym. */
function budgetTable(M, ym) {
  const prog = monthProgress(M, ym);
  const lb = leafBudget(M, ym);
  const exp = reportable(M, monthTx(M, ym)).filter(t => t.type === 'expense');
  const pend = M.pending.filter(t => t.date.startsWith(ym));
  const leafSpent = {};
  exp.forEach(t => {
    leafSpent[t.category] = (leafSpent[t.category] || 0) + t.amount;
  });
  const parents = {};
  const touch = p => parents[p] = parents[p] || {
    name: p,
    target: 0,
    spent: 0,
    children: {},
    pendingAmt: 0
  };
  Object.keys(lb).forEach(c => {
    if (M.excluded(c)) return;
    const p = touch(M.parentOf(c));
    p.target += lb[c];
    p.children[c] = p.children[c] || {
      name: c,
      target: 0,
      spent: 0
    };
    p.children[c].target += lb[c];
  });
  Object.keys(leafSpent).forEach(c => {
    const p = touch(M.parentOf(c));
    p.spent += leafSpent[c];
    p.children[c] = p.children[c] || {
      name: c,
      target: 0,
      spent: 0
    };
    p.children[c].spent += leafSpent[c];
  });
  pend.forEach(t => {
    const p = touch(M.parentOf(t.category));
    p.pendingAmt += t.amount;
  });
  const enrich = (o, fixed, pendingAmt) => {
    const toDate = fixed ? o.target : o.target * prog.d / prog.D;
    const fc = forecastOf(o.spent, o.target, prog, fixed, pendingAmt);
    return Object.assign(o, {
      fixed,
      toDate,
      forecast: fc,
      diffToDate: o.spent - toDate,
      remaining: o.target - o.spent
    });
  };
  const rows = Object.values(parents).map(p => {
    const fixed = M.isFixed(p.name);
    p.children = Object.values(p.children).map(c => enrich(c, fixed, 0)).sort((a, b) => b.target - a.target || b.spent - a.spent);
    return enrich(p, fixed, p.pendingAmt);
  }).sort((a, b) => (b.target > 0) - (a.target > 0) || b.target - a.target || b.spent - a.spent);
  const T = rows.reduce((s, r) => ({
    target: s.target + r.target,
    spent: s.spent + r.spent,
    toDate: s.toDate + r.toDate,
    forecast: s.forecast + r.forecast
  }), {
    target: 0,
    spent: 0,
    toDate: 0,
    forecast: 0
  });
  T.remaining = T.target - T.spent;
  T.safePerDay = prog.left > 0 ? Math.max(0, T.remaining - sumBy(rows.filter(r => r.fixed), r => Math.max(0, r.target - r.spent))) / prog.left : null;
  return {
    prog,
    rows,
    total: T
  };
}

/** Chi trung bình/tháng của n tháng trọn vẹn gần nhất (trước tháng hiện tại), theo nhóm lá. */
function avgSpend(M, n = 3) {
  const out = {},
    cur = ymOf(M.today);
  for (let k = 1; k <= n; k++) {
    reportable(M, monthTx(M, ymAdd(cur, -k))).filter(t => t.type === 'expense').forEach(t => {
      out[t.category] = (out[t.category] || 0) + t.amount / n;
    });
  }
  return out;
}

/** Status 1 dòng budget → {cls, text}. */
function paceStatus(r, prog) {
  if (!r.target) return r.spent ? {
    cls: 'n',
    text: 'No budget'
  } : {
    cls: 'n',
    text: '—'
  };
  if (r.spent > r.target) return {
    cls: 'r',
    text: 'Over month +' + fmt(r.spent - r.target)
  };
  if (r.fixed) return {
    cls: 'n',
    text: 'Fixed bill · ' + fmtPct(r.spent / r.target)
  };
  if (!prog.isCurrent) return {
    cls: 'g',
    text: 'Under ' + fmt(r.target - r.spent)
  };
  if (r.diffToDate > 0) return {
    cls: 'r',
    text: 'Over to date +' + fmt(r.diffToDate)
  };
  if (r.forecast > r.target) return {
    cls: 'a',
    text: 'Forecast over +' + fmt(r.forecast - r.target)
  };
  return {
    cls: 'g',
    text: 'Under −' + fmt(-r.diffToDate)
  };
}

/** Thu/chi/tiết kiệm của tháng + dự báo. */
function monthSummary(M, ym) {
  const list = reportable(M, monthTx(M, ym));
  const income = sumBy(list.filter(t => t.type === 'income'), t => t.amount);
  const expense = sumBy(list.filter(t => t.type === 'expense'), t => t.amount);
  return {
    income,
    expense,
    net: income - expense
  };
}
function savingsView(M, ym) {
  const s = monthSummary(M, ym);
  const bt = budgetTable(M, ym);
  const prev = [1, 2, 3].map(k => monthSummary(M, ymAdd(ym, -k)).income).filter(v => v > 0);
  const avgInc = prev.length ? sumBy(prev, v => v) / prev.length : 0;
  const expIncome = bt.prog.d >= bt.prog.D ? s.income : Math.max(s.income, avgInc);
  const target = Number(M.settings.savings_target) || 0.45;
  const fcSpend = Math.max(s.expense, bt.total.forecast);
  const fcSaved = expIncome - fcSpend;
  return {
    ...s,
    target,
    expIncome,
    avgInc,
    incomeIsEstimate: expIncome > s.income,
    savedPct: s.income > 0 ? s.net / s.income : null,
    fcSpend,
    fcSaved,
    fcPct: expIncome > 0 ? fcSaved / expIncome : null,
    spendLimit: expIncome * (1 - target),
    prog: bt.prog
  };
}

/**
 * Báo cáo theo kỳ (tháng 'yyyy-MM' hoặc năm 'yyyy'): thu/chi/net, cơ cấu theo nhóm cha, số dư đầu/cuối,
 * ngân sách cộng dồn của kỳ (năm: chỉ cộng các tháng đã qua/đang chạy).
 */
function periodReport(M, period) {
  const isYear = period.length === 4;
  const months = isYear ? Array.from({
    length: 12
  }, (_, i) => period + '-' + pad2(i + 1)) : [period];
  const first = months[0] + '-01',
    next = ymAdd(months[months.length - 1], 1) + '-01';
  const list = reportable(M, M.posted.filter(t => t.date >= first && t.date < next));
  const by = {
    expense: {},
    income: {}
  };
  list.forEach(t => {
    const p = M.parentOf(t.category);
    by[t.type][p] = (by[t.type][p] || 0) + t.amount;
  });
  const parts = type => Object.keys(by[type]).map(k => ({
    k,
    v: by[type][k]
  })).sort((a, b) => b.v - a.v);
  const income = sumBy(list.filter(t => t.type === 'income'), t => t.amount);
  const expense = sumBy(list.filter(t => t.type === 'expense'), t => t.amount);
  const tym = ymOf(M.today);
  const live = months.filter(m => m <= tym); // tháng đã có số liệu
  const inBudget = c => !M.excluded(c);
  const budgetOf = m => Object.entries(leafBudget(M, m)).filter(([c]) => inBudget(c)).reduce((s, [, v]) => s + v, 0);
  const budget = sumBy(live, budgetOf);
  const budgetSpent = sumBy(list.filter(t => t.type === 'expense' && inBudget(t.category)), t => t.amount);
  const byParentBudget = {};
  live.forEach(m => Object.entries(leafBudget(M, m)).forEach(([c, v]) => {
    if (inBudget(c)) {
      const p = M.parentOf(c);
      byParentBudget[p] = (byParentBudget[p] || 0) + v;
    }
  }));
  const series = months.map(m => ({
    m,
    ...monthSummary(M, m)
  }));
  return {
    isYear,
    months,
    first,
    next,
    income,
    expense,
    net: income - expense,
    budget,
    budgetSpent,
    byParentBudget,
    open: balanceAt(M, first),
    close: balanceAt(M, next > M.today ? null : next),
    expParts: parts('expense'),
    incParts: parts('income'),
    series,
    nLive: Math.max(1, live.length),
    savedPct: income > 0 ? (income - expense) / income : null,
    target: Number(M.settings.savings_target) || 0.45
  };
}
/** Chi theo ngày trong tháng + đường ngân sách cộng dồn. */
function dailyCumulative(M, ym) {
  const D = daysIn(ym),
    prog = monthProgress(M, ym);
  const daily = Array(D).fill(0);
  reportable(M, monthTx(M, ym)).filter(t => t.type === 'expense').forEach(t => {
    daily[+t.date.slice(8, 10) - 1] += t.amount;
  });
  const cum = [];
  daily.reduce((s, v, i) => {
    cum[i] = i < prog.d || !prog.isCurrent ? s + v : null;
    return s + v;
  }, 0);
  const target = Object.entries(leafBudget(M, ym)).filter(([c]) => !M.excluded(c)).reduce((s, [, v]) => s + v, 0);
  return {
    D,
    daily,
    cum,
    target,
    pace: daily.map((_, i) => target * (i + 1) / D)
  };
}

// ---- Gợi ý nhóm & nhập nhanh ----
/** Xếp hạng nhóm theo tần suất 90 ngày (có trọng số gần đây) + cùng khung giờ (±2h) + cùng thứ. */
/**
 * Đoán nhóm theo số tiền: 200 → Bửu, 60 → Xăng dầu... dựa trên giao dịch cùng số tiền trong 180 ngày (giảm dần theo thời gian).
 * Chỉ trả khi có ≥2 lần và nhóm đó chiếm ≥50% số lần dùng số tiền này.
 */
function predictByAmount(M, type, amount, now = new Date()) {
  if (!(amount > 0)) return null;
  const cutoff = new Date(now.getTime() - 180 * 864e5).toISOString().slice(0, 10);
  const score = {},
    count = {};
  let total = 0;
  M.posted.forEach(t => {
    if (t.type !== type || t.amount !== amount || t.date < cutoff || t.source === 'ml_report' || M.excluded(t.category)) return;
    const w = Math.exp(-((now - new Date(t.date)) / 864e5) / 60);
    score[t.category] = (score[t.category] || 0) + w;
    count[t.category] = (count[t.category] || 0) + 1;
