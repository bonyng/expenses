<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbxfGJti6JuILSU_NeaFb5ATQPU5L00tY8uenZQFFT7xtukQqA0fZhBnu2mZI5crjE16/exec", KEY = 'exp_key';
  function getKey() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function askKey() {
    var k = prompt('Enter your access key');
    if (k && k.trim()) { try { localStorage.setItem(KEY, k.trim()); } catch (e) {} location.reload(); }
  }
  function call(fn, args) {
    // GET ?q=: iOS Safari làm rơi thân POST khi đi qua redirect của Apps Script.
    var q = encodeURIComponent(JSON.stringify({ fn: fn, args: args, key: getKey() }));
    return fetch(API + '?q=' + q + '&_=' + Date.now(), { redirect: 'follow', cache: 'no-store' }).then(function (r) { return r.json(); });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (_, p) {
      if (p === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (p === 'withFailureHandler') return function (f) { return runner(ok, f); };
      return function () {
        call(p, [].slice.call(arguments)).then(function (res) {
          if (res && res.error === 'Unauthorized') { askKey(); if (fail) fail('Access key required'); return; }
          if (!res || res.service === 'expense-api') { if (fail) fail('Unexpected API response'); return; }
          if (ok) ok(res);
        }).catch(function (e) { if (fail) fail('Network error: ' + (e && e.message || e)); });
      };
    } });
  }
  window.google = { script: { run: runner(), url: { getLocation: function (cb) {
    var q = {}; new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; }); cb({ parameter: q, hash: location.hash });
  } } } };
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
})();

<style>

:root {
  --bg: #0E0E0F;
  --card: #1C1C1E;
  --card2: #2A2A2D;
  --line: #2E2E31;
  --text: #F2F2F2;
  --muted: #8E8E93;
  --green: #2DB84C;
  --green-bg: rgba(45, 184, 76, .14);
  --red: #FF5A52;
  --red-bg: rgba(255, 90, 82, .16);
  --amber: #F5B83D;
  --amber-bg: rgba(245, 184, 61, .15);
  --blue: #3B8BFF;
  --radius: 18px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: 'Be Vietnam Pro', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.35; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: var(--text); }
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(var(--nav-h) + var(--safe-b) + 28px); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); } .amber { color: var(--amber); }
.small { font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* header */
.hdr { padding: 18px 0 10px; }
.hdr h1 { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -.5px; }
.hdr .sub { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: middle; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--card); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
.unit { font-size: 12px; color: var(--muted); font-style: italic; }

/* month switcher */
.seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin: 10px 0 14px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .3px; }
.seg button.on { background: var(--card2); color: var(--green); }
.mswitch { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 14px; }
.mswitch .lbl { font-weight: 600; font-size: 16px; }
.mswitch button { width: 40px; height: 36px; border-radius: 10px; background: var(--card); font-size: 18px; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.card.tight { padding: 0; overflow: hidden; }
.sec-title { font-size: 13px; font-weight: 700; letter-spacing: .8px; color: var(--muted); text-transform: uppercase; margin: 18px 2px 10px; display: flex; justify-content: space-between; align-items: center; }
.sec-title .link { text-transform: none; letter-spacing: 0; color: var(--green); font-weight: 600; font-size: 14px; }

.mid { font-size: 20px; font-weight: 600; }
.kgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.kbox { background: var(--card2); border-radius: 12px; padding: 11px 12px; }
.kbox .k { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.g { background: var(--green-bg); color: var(--green); }

/* progress */

/* add form */
.typeseg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.typeseg button { flex: 1; padding: 8px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.typeseg button.on.e { background: var(--red-bg); color: var(--red); }
.typeseg button.on.i { background: rgba(59, 139, 255, .16); color: var(--blue); }
.quick { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.quick input { flex: 1; background: none; border: 0; outline: none; font-size: 16px; }
.amount-disp { text-align: right; font-size: 40px; font-weight: 700; padding: 6px 4px 2px; letter-spacing: -.5px; }

.field { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
.field input, .field select { flex: 1; background: none; border: 0; outline: none; font-size: 15px; min-width: 0; }

.keypad button.op { background: var(--card2); font-size: 16px; }
.keypad button.ok { background: var(--green); color: #fff; font-weight: 700; font-size: 16px; grid-row: span 2; height: auto; }
.catgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.catgrid button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; font-size: 11.5px; text-align: center; }
.catgrid button.on { background: var(--green-bg); color: var(--green); }
.catgrid .ic { width: 42px; height: 42px; }
.parent-lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin: 12px 4px 4px; text-transform: uppercase; letter-spacing: .6px; }
.btn { display: block; width: 100%; padding: 14px; border-radius: 14px; background: var(--green); color: #fff; font-weight: 700; font-size: 16px; text-align: center; }
.btn.ghost { background: var(--card); color: var(--text); }
.btn.danger { background: var(--red-bg); color: var(--red); }

/* misc */
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 9px 12px; margin-bottom: 12px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + var(--safe-b) + 18px); background: #2C2C2E; color: var(--text); padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); max-width: 90vw; }

.hbar > div { height: 100%; border-radius: 4px; background: var(--green); }
.chart-box { position: relative; height: 210px; }
.ring { width: 72px; height: 72px; flex: none; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Add transaction — kiểu Money Lover */
.mlform { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 14px; margin-bottom: 12px; }
.mlrow { display: flex; align-items: center; gap: 14px; min-height: 58px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mlrow:last-child { border-bottom: 0; }
.mlrow input { background: none; border: 0; outline: none; font-size: 16px; min-width: 0; color: var(--text); }

.mlrow.amt.focus .mlamt { border-bottom-color: var(--green); }
.curbox { flex: none; width: 40px; height: 28px; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }

<body>
<div id="boot-error" style="display:none;font-family:Arial;padding:16px;color:#FCA5A5;background:#3B1111;border:1px solid #7F1D1D;margin:16px;border-radius:12px;"></div>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8E8E93;font-family:sans-serif;font-size:14px;gap:10px;background:#0E0E0F;">
    <div style="width:18px;height:18px;border:3px solid #2A2A2D;border-top-color:#2DB84C;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    Loading…
  </div>
</div>
<script>
// ===================================================================
// CORE — format, RPC, model (mọi phép tính nằm ở đây; page chỉ hiển thị)
// Đơn vị: NGHÌN ĐỒNG. Không nhân 1.000, không gắn ₫.
// ===================================================================
const {
  useState,
  useEffect,
  useMemo,
  useRef,
  useCallback
} = React;
const UNIT_LABEL = 'Unit: thousand VND';
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON3 = MONTHS.map(m => m.slice(0, 3));
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// ---- format ----
const NF = new Intl.NumberFormat('en-US', {
  maximumFractionDigits: 0
});
const fmt = v => v == null || isNaN(v) ? '—' : NF.format(Math.round(v * 100) / 100);
const fmtS = v => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + NF.format(Math.abs(Math.round(v * 100) / 100));
const fmtPct = v => v == null || !isFinite(v) ? '—' : Math.round(v * 100) + '%';
const pad2 = n => ('0' + n).slice(-2);
const ymOf = d => d.slice(0, 7); // 'yyyy-MM'
const ymLabel = ym => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const ymShort = ym => MON3[+ym.slice(5, 7) - 1] + ' ' + ym.slice(2, 4);
const ymAdd = (ym, k) => {
  const y = +ym.slice(0, 4),
    m = +ym.slice(5, 7) - 1 + k;
  const d = new Date(y, m, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
};
const daysIn = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
const budgetMonthKey = ym => ym.slice(5, 7) + '/' + ym.slice(0, 4); // sheet Budgets dùng MM/YYYY
const dowOf = d => new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)).getDay();
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
const parseNum = s => {
  const t = String(s || '').trim().replace(/,/g, '');
  if (!t) return null;
  const n = Number(t);
  return isNaN(n) ? null : n;
};

// ---- RPC ----
const IS_SNAPSHOT = !!window.__SNAPSHOT__;
function rpc(fn, payload) {
  return new Promise((resolve, reject) => {
    if (IS_SNAPSHOT) {
      resolve(fn === 'getBootstrap' ? window.__SNAPSHOT__ : {
        __ok: true
      });
      return;
    }
    if (!window.google || !google.script || !google.script.run) {
      reject('Open this page from the deployed web app link.');
      return;
    }
    google.script.run.withSuccessHandler(res => res && res.__ok ? resolve(res) : reject(res && res.error || 'Unknown error')).withFailureHandler(err => reject(String(err && err.message || err)))[fn](payload);
  });
}
const BOOT_CACHE = 'exp_boot';
function readBootCache() {
  try {
    const b = JSON.parse(localStorage.getItem(BOOT_CACHE) || 'null');
    if (!b || !b.tx) return null;
    const d = new Date(),
      today = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    return {
      ...b,
      today
    }; // dữ liệu cũ nhưng ngày phải là hôm nay
  } catch (e) {
    return null;
  }
}
function readUrlParams() {
  return new Promise(resolve => {
    try {
      google.script.url.getLocation(loc => resolve(loc.parameter || {}));
    } catch (e) {
      resolve({});
    }
  });
}

// ---- model ----
function buildModel(boot) {
  const cols = boot.tx.cols;
